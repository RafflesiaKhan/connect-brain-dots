name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs the full 5-stage agent against a scripted mock model: no API keys or database needed.
      - name: Agent guardrail tests
        run: npm run test:agent

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
