# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cbd
    ports:
      - "5432:5432"
    volumes:
      - cbd-pg:/var/lib/postgresql/data
volumes:
  cbd-pg:
